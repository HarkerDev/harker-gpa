<!DOCTYPE HTML>
<html>

<head>
    <title>Harker GPA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Harker GPA Calculator">
    <meta name="author" content="HarkerDev">

    <link href="https://fonts.googleapis.com/css?family=Lexend+Deca|Roboto" rel="stylesheet">
    <link href="main.css?v=2" rel="stylesheet">
    <script>
        window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
        ga('create', 'UA-136862177-4', 'auto');
        ga('send', 'pageview');
    </script>
    <script async src='https://www.google-analytics.com/analytics.js'></script>
</head>

<body>
    <main class="page">
        <div class="card">

            <header class="card-header">
                <h1>Harker GPA Calculator</h1>
                <p class="subtitle">Enter your courses below to calculate your semester and overall GPA.</p>
            </header>

            <fieldset class="field-block" id="isWeighted">
                <legend class="field-label">Grading System</legend>
                <label class="radio">
                    <input type="radio" name="weighted" value="Harker Weighted" checked>
                    <span>Harker Weighted</span>
                </label>
                <label class="radio">
                    <input type="radio" name="weighted" value="Harker Unweighted">
                    <span>Harker Unweighted</span>
                </label>
                <label class="radio">
                    <input type="radio" name="weighted" value="Standard Unweighted">
                    <span>Standard Unweighted</span>
                </label>
            </fieldset>

            <form id="classList">
                <div id="semList"></div>

                <div class="form-actions">
                    <button type="button" id="addSemButton" onclick="addSemester()">
                        <span class="icon">+</span> Add Semester
                    </button>
                    <button type="button" id="removeSemButton" onclick="removeLastSemester()" style="display:none">
                        <span class="icon">&minus;</span> Remove Semester
                    </button>
                </div>
            </form>

            <div class="card-footer">
                <p id="gpa"></p>
                <button type="button" id="calcGPA" onclick="submitForm()">Calculate GPA</button>
            </div>

        </div>

        <p class="credit">
            Made with &lt;&gt; by <a href="https://dev.harker.org/?utm_source=gpa&utm_medium=madeby" target="blank">HarkerDev</a>.
        </p>
    </main>

    <script src="script.js?v=6"></script>

</body>

</html>
